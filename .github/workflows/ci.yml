# 型チェックと、単体・アダプタのテスト（Docker を使わないもの）を PR ごとに流す。
# 本物の BTCPay と bitcoind を使う統合テストの CI は W4 で追加する（ADR 10）
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/shop-app
    steps:
      - uses: actions/checkout@v4

      # pnpm の版は package.json の packageManager に合わせる
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/shop-app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/shop-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm test
